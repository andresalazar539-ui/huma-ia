<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>HUMA por dentro</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C8553D">
<script>
  // Mesmo tema do Cockpit, aplicado antes do primeiro paint.
  try { if (localStorage.getItem('huma_theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
</script>
<link rel="stylesheet" href="/static/cockpit/colors_and_type.css?v=__ASSET_V__"/>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  #root { height: 100vh; height: 100dvh; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--ink-line); border-radius: 999px; }
  ::-webkit-scrollbar-track { background: transparent; }
  button { font-family: inherit; }
  @media (max-width: 767px) { input, textarea, select { font-size: 16px !important; } }
  .ad-nav-item { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 10px; border: 0; background: transparent; color: var(--ink-2); font-family: var(--font-sans); font-size: 13.5px; cursor: pointer; }
  .ad-nav-item:hover { background: var(--paper-sunk); color: var(--ink); }
  .ad-nav-item.on { background: var(--ink); color: #fff; }
  .ad-nav-item .dot { width: 7px; height: 7px; border-radius: 999px; background: currentColor; opacity: .55; flex-shrink: 0; }
  @keyframes fadeInUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .screen-enter { animation: fadeInUp 220ms cubic-bezier(0.22, 1, 0.36, 1); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<!-- Só o que o painel precisa: átomos, camada de API (AUTH_HEADERS, _readApiError),
     tiles/grade/setas do ReportsScreen e a própria tela. Mesmo escopo global do Cockpit. -->
<script type="text/babel" src="/static/cockpit/Atoms.jsx?v=__ASSET_V__"></script>
<script type="text/babel" src="/static/cockpit/ConversationsData.jsx?v=__ASSET_V__"></script>
<script type="text/babel" src="/static/cockpit/ReportsScreen.jsx?v=__ASSET_V__"></script>
<script type="text/babel" src="/static/cockpit/AdminScreen.jsx?v=__ASSET_V__"></script>

<script type="text/babel">
// Painel do dono da HUMA fora do Cockpit (2026-10-27, pedido do André: "é só
// meu, quero em outro lugar, mais legal, com menu e convite"). Endereço: /admin.
// A trava de acesso é do servidor (require_admin): sem e-mail em
// HUMA_ADMIN_EMAILS (ou convidado na tabela admin_users) a página nem existe.
const { useState: useStateAp, useEffect: useEffectAp } = React;

const AP_SUB = {
  visao: 'dinheiro, growth, risco', contas: 'busca e ficha', custos: 'margem all-in', trilha: 'tudo que aconteceu',
  pedidos: 'sob medida', acesso: 'quem entra aqui', sistema: 'saúde e versão',
};

function readSection() {
  const s = new URLSearchParams(location.search).get('section') || '';
  return (window.AD_SECTIONS || []).some(x => x.id === s) ? s : 'visao';
}

function AdminApp() {
  const [section, setSectionState] = useStateAp(readSection);
  const [dark, setDark] = useStateAp(() => { try { return localStorage.getItem('huma_theme') === 'dark'; } catch (e) { return false; } });
  const [narrow, setNarrow] = useStateAp(() => window.innerWidth < 900);
  useEffectAp(() => {
    try { localStorage.setItem('huma_theme', dark ? 'dark' : 'light'); } catch (e) {}
    if (dark) document.documentElement.setAttribute('data-theme', 'dark'); else document.documentElement.removeAttribute('data-theme');
  }, [dark]);
  useEffectAp(() => {
    const onR = () => setNarrow(window.innerWidth < 900);
    const onPop = () => setSectionState(readSection());
    window.addEventListener('resize', onR); window.addEventListener('popstate', onPop);
    return () => { window.removeEventListener('resize', onR); window.removeEventListener('popstate', onPop); };
  }, []);
  const setSection = (id) => {
    setSectionState(id);
    try { history.pushState(null, '', id === 'visao' ? '/admin' : `/admin?section=${id}`); } catch (e) {}
  };
  const sections = window.AD_SECTIONS || [];
  const nav = (
    <nav style={{ display: 'flex', flexDirection: narrow ? 'row' : 'column', gap: narrow ? 4 : 2, overflowX: narrow ? 'auto' : 'visible', padding: narrow ? '8px 12px' : '14px 12px', flexShrink: 0 }}>
      {sections.map(s => (
        <button key={s.id} className={`ad-nav-item${section === s.id ? ' on' : ''}`} onClick={() => setSection(s.id)} style={narrow ? { width: 'auto', whiteSpace: 'nowrap', padding: '7px 12px' } : undefined}>
          {!narrow && <span className="dot"></span>}
          <span style={{ display: 'flex', flexDirection: 'column', minWidth: 0 }}>
            <span style={{ fontWeight: 500 }}>{s.label}</span>
            {!narrow && <span style={{ fontSize: 11.5, opacity: .7 }}>{AP_SUB[s.id] || ''}</span>}
          </span>
        </button>
      ))}
    </nav>
  );
  return (
    <div style={{ display: 'flex', flexDirection: narrow ? 'column' : 'row', height: '100%', background: 'var(--paper)' }}>
      <aside style={{ width: narrow ? '100%' : 232, borderRight: narrow ? 'none' : '1px solid var(--paper-edge)', borderBottom: narrow ? '1px solid var(--paper-edge)' : 'none', background: 'var(--paper-raised)', display: 'flex', flexDirection: 'column', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: narrow ? '12px 16px 0' : '18px 20px 6px' }}>
          <span style={{ fontFamily: 'var(--font-serif)', fontSize: 19, color: 'var(--ink)' }}>HUMA</span>
          <span style={{ fontFamily: 'var(--font-mono)', fontSize: 10.5, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--terracotta-ink)' }}>por dentro</span>
          {narrow && <span style={{ marginLeft: 'auto', display: 'flex', gap: 6 }}>
            <Button variant="ghost" size="sm" onClick={() => setDark(d => !d)}>{dark ? 'Claro' : 'Escuro'}</Button>
            <a href="/cockpit" style={{ fontFamily: 'var(--font-sans)', fontSize: 12.5, color: 'var(--ink-2)', textDecoration: 'none', padding: '6px 10px', borderRadius: 9, border: '1px solid var(--paper-edge)' }}>Cockpit</a>
          </span>}
        </div>
        {nav}
        {!narrow && (
          <div style={{ marginTop: 'auto', padding: '12px 16px 16px', borderTop: '1px solid var(--paper-edge)', display: 'flex', flexDirection: 'column', gap: 8 }}>
            <div style={{ fontFamily: 'var(--font-sans)', fontSize: 12, color: 'var(--ink-3)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }} title={window.HUMA_EMAIL || ''}>{window.HUMA_EMAIL || ''}</div>
            <div style={{ display: 'flex', gap: 6 }}>
              <Button variant="ghost" size="sm" onClick={() => setDark(d => !d)}>{dark ? 'Tema claro' : 'Tema escuro'}</Button>
              <a href="/cockpit" style={{ fontFamily: 'var(--font-sans)', fontSize: 12.5, color: 'var(--ink-2)', textDecoration: 'none', padding: '6px 10px', borderRadius: 9, border: '1px solid var(--paper-edge)' }}>Ir pro Cockpit</a>
            </div>
          </div>
        )}
      </aside>
      <div key={section} className="screen-enter" style={{ flex: 1, display: 'flex', minWidth: 0, minHeight: 0 }}>
        <AdminScreen section={section} onSection={setSection} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
</script>
</body>
</html>
