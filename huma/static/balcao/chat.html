<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Atendimento</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F2EC;
    --paper-raised: #FBF8F3;
    --paper-sunk: #EFE9DF;
    --paper-edge: #E5DED1;
    --ink: #1C1714;
    --ink-2: #3A332D;
    --ink-3: #6B6259;
    --ink-4: #9A9086;
    --terracotta: #C8553D;
    --terracotta-ink: #8E3724;
    --terracotta-tint: #FBEEE8;
    --sage-tint: #EAF0E7;
    --font-sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --font-serif: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif; /* 2026-10-25: sem serifa */
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 15.5px;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--paper-raised);
    border-bottom: 1px solid var(--paper-edge);
    padding: 14px 18px calc(14px);
    padding-top: max(14px, env(safe-area-inset-top));
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--terracotta);
    color: #FFF;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-serif);
    font-size: 20px;
    flex-shrink: 0;
  }
  .head-txt { min-width: 0; }
  .biz-name {
    font-weight: 600; font-size: 16px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .status-line {
    font-size: 12.5px; color: var(--ink-3);
    display: flex; align-items: center; gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #4F7A4A; }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 18px 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    -webkit-overflow-scrolling: touch;
  }
  .msg {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.45;
    word-wrap: break-word;
    white-space: pre-wrap;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }
  .msg.bot {
    background: var(--paper-raised);
    border: 1px solid var(--paper-edge);
    border-bottom-left-radius: 6px;
    align-self: flex-start;
  }
  .msg.user {
    background: var(--terracotta);
    color: #FFF9F5;
    border-bottom-right-radius: 6px;
    align-self: flex-end;
  }
  .msg.sys {
    background: var(--paper-sunk);
    color: var(--ink-3);
    font-size: 13px;
    align-self: center;
    text-align: center;
    max-width: 92%;
  }
  /* Cards de produto (2026-09-07): carrossel horizontal dentro da conversa */
  .cards {
    display: flex; gap: 10px; overflow-x: auto; padding: 2px 0 6px;
    max-width: 92%; align-self: flex-start; scroll-snap-type: x mandatory;
    -webkit-overflow-scrolling: touch; animation: rise .18s ease-out;
  }
  .card {
    flex: 0 0 200px; scroll-snap-align: start; display: flex; flex-direction: column;
    background: var(--paper-raised); border: 1px solid var(--paper-edge);
    border-radius: 14px; overflow: hidden;
  }
  .card .img { width: 100%; height: 130px; object-fit: cover; background: var(--paper-sunk); display: block; }
  .card .noimg { width: 100%; height: 130px; background: var(--paper-sunk); display: flex; align-items: center; justify-content: center; color: var(--ink-3); font-size: 28px; }
  .card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; }
  .card .title { font-weight: 600; font-size: 14px; line-height: 1.3; }
  .card .sub { font-size: 13px; color: var(--ink-3); }
  .card .buy {
    margin-top: 6px; display: inline-block; text-align: center; text-decoration: none;
    background: var(--terracotta); color: #FFF9F5; font-size: 13px; font-weight: 600;
    padding: 8px 10px; border-radius: 10px;
  }
  .card .want {
    margin-top: 4px; background: transparent; border: 1px solid var(--paper-edge);
    color: inherit; font-size: 13px; padding: 7px 10px; border-radius: 10px; cursor: pointer;
  }
  /* Caixinha na bolha (2026-09-10): o pagamento abre DENTRO do widget */
  .card.checkout { flex-basis: 250px; border-color: var(--terracotta); }
  .card .pay {
    margin-top: 6px; border: none; background: var(--terracotta); color: #FFF9F5;
    font-size: 13px; font-weight: 600; padding: 9px 10px; border-radius: 10px; cursor: pointer; width: auto; height: auto;
  }
  .sheet {
    position: absolute; inset: 0; z-index: 20; display: flex; flex-direction: column;
    background: var(--paper); animation: rise .18s ease-out;
  }
  .sheet .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; background: var(--paper-raised); border-bottom: 1px solid var(--paper-edge);
    font-size: 13px; color: var(--ink-3); flex-shrink: 0;
  }
  .sheet .bar button { width: auto; height: auto; border-radius: 10px; padding: 6px 12px; font-size: 13px; background: transparent; color: var(--ink); border: 1px solid var(--paper-edge); }
  .sheet iframe { flex: 1; width: 100%; border: 0; background: var(--paper); }
  .typing {
    align-self: flex-start;
    background: var(--paper-raised);
    border: 1px solid var(--paper-edge);
    border-radius: 16px;
    border-bottom-left-radius: 6px;
    padding: 12px 16px;
    display: flex; gap: 5px;
  }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--ink-4);
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; } 30% { opacity: 1; } }

  form {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    background: var(--paper-raised);
    border-top: 1px solid var(--paper-edge);
  }
  input[type="text"] {
    flex: 1;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    border-radius: 22px;
    padding: 11px 16px;
    font-family: var(--font-sans);
    font-size: 15.5px;
    color: var(--ink);
    outline: none;
    min-width: 0;
  }
  input[type="text"]:focus { border-color: var(--terracotta); }
  /* Áudio do visitante (2026-10-25): microfone ao lado do enviar. */
  #mic { background: var(--paper); color: var(--terracotta); border: 1px solid var(--terracotta); }
  #mic.rec { background: #C8553D; color: #FFF; border-color: #C8553D; animation: recPulse 1.1s ease-in-out infinite; }
  #mic:disabled { opacity: .5; cursor: default; }
  @keyframes recPulse { 50% { box-shadow: 0 0 0 8px rgba(200, 85, 61, .22); } }
  /* Ditado por voz (estilo Fin): enquanto grava, o campo vira uma barra com
     × pra cancelar, a onda da voz e ■ pra parar. O texto cai no campo. */
  .rec-live {
    display: none; flex: 1; align-items: center; gap: 8px; min-width: 0;
    border: 1px solid var(--terracotta); background: var(--paper); border-radius: 22px; padding: 4px 4px 4px 6px;
  }
  form.recording .rec-live { display: flex; }
  form.recording input[type="text"], form.recording #mic, form.recording #send { display: none; }
  .rec-live .rec-cancel, .rec-live .rec-stop {
    width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .rec-live .rec-cancel { background: transparent; color: var(--ink-3); border: none; }
  .rec-live .rec-cancel:hover { color: var(--ink); }
  .rec-live .rec-stop { background: var(--terracotta); color: #FFF; border: none; }
  .rec-live .bars { display: flex; align-items: center; gap: 2px; height: 34px; flex: 1; overflow: hidden; justify-content: flex-end; }
  .rec-live .bars i { display: block; width: 2.5px; border-radius: 2px; background: var(--terracotta); min-height: 3px; flex-shrink: 0; }
  .rec-live .time { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; flex-shrink: 0; }
  input[type="text"].transcribing { color: var(--ink-3); font-style: normal; }
  button {
    border: none;
    background: var(--terracotta);
    color: #FFF;
    width: 44px; height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  button:disabled { background: var(--ink-4); cursor: default; }
  button:focus-visible { outline: 2px solid var(--terracotta-ink); outline-offset: 2px; }

  .powered {
    text-align: center;
    font-size: 11px;
    color: var(--ink-4);
    padding: 0 0 8px;
    background: var(--paper-raised);
    flex-shrink: 0;
  }
  .powered a { color: var(--ink-4); }
</style>
</head>
<body style="position:relative">
  <header>
    <div class="avatar" id="avatar">·</div>
    <div class="head-txt">
      <div class="biz-name" id="bizName">Carregando…</div>
      <div class="status-line"><span class="dot"></span> Online agora</div>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Escreva sua mensagem…" maxlength="800" aria-label="Sua mensagem">
    <div class="rec-live" id="recLive" aria-hidden="true">
      <button type="button" class="rec-cancel" id="recCancel" aria-label="Cancelar gravação">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
      <div class="bars" id="recBars"></div>
      <span class="time" id="recTime">0:00</span>
      <button type="button" class="rec-stop" id="recStop" aria-label="Parar e transcrever">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="3"/></svg>
      </button>
    </div>
    <button type="button" id="mic" aria-label="Gravar áudio" title="Gravar áudio" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/><path d="M8 22h8"/>
      </svg>
    </button>
    <button type="submit" id="send" aria-label="Enviar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2z"/>
      </svg>
    </button>
  </form>
  <div class="powered">com <a href="https://app.humaia.com.br" target="_blank" rel="noopener">HUMA IA</a></div>

<script>
(function () {
  'use strict';

  // /c/<client_id> — o id vem da própria URL da página hospedada.
  var parts = window.location.pathname.split('/').filter(Boolean);
  var clientId = parts.length >= 2 && parts[0] === 'c' ? parts[1] : '';

  var chat = document.getElementById('chat');
  var form = document.getElementById('form');
  var input = document.getElementById('input');
  var sendBtn = document.getElementById('send');
  var micBtn = document.getElementById('mic');
  var bizName = document.getElementById('bizName');
  var avatar = document.getElementById('avatar');

  // localStorage pode LANÇAR (iframe com cookies de terceiros bloqueados,
  // Safari privado, política corporativa). Sem storage o chat continua
  // funcionando — só perde a persistência entre visitas.
  var mem = {};
  function sGet(k) { try { return localStorage.getItem(k); } catch (e) { return mem[k] || null; } }
  function sSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { mem[k] = v; } }

  function randomHex32() {
    var out = '';
    try {
      var bytes = new Uint8Array(16);
      (window.crypto || window.msCrypto).getRandomValues(bytes);
      for (var i = 0; i < bytes.length; i++) out += bytes[i].toString(16).padStart(2, '0');
    } catch (e) {
      for (var j = 0; j < 32; j++) out += Math.floor(Math.random() * 16).toString(16);
    }
    return out;
  }

  var sidKey = 'huma_balcao_sid_' + clientId;
  var sessionId = sGet(sidKey);
  if (!sessionId || !/^[a-f0-9]{32}$/.test(sessionId)) {
    sessionId = randomHex32();
    sSet(sidKey, sessionId);
  }

  var histKey = 'huma_balcao_hist_' + clientId;
  var seenKey = 'huma_balcao_seen_' + clientId;

  function loadHistory() {
    try { return JSON.parse(sGet(histKey) || '[]'); }
    catch (e) { return []; }
  }
  function saveHistory(items) {
    try { sSet(histKey, JSON.stringify(items.slice(-60))); }
    catch (e) { /* histórico local é cosmético */ }
  }

  var history = loadHistory();
  // Cursor do poll: índice do history do SERVIDOR já visto. null =
  // ainda não conhecemos (só passa a existir após o 1º envio).
  var seen = parseInt(sGet(seenKey), 10);
  if (isNaN(seen)) seen = null;
  function setSeen(n) { seen = n; sSet(seenKey, String(n)); }

  // Links no texto viram <a> (o resto segue como texto puro, sem HTML).
  var URL_RE = /https?:\/\/[^\s<>"')\]]+/g;
  function fillText(el, text) {
    var s = String(text || ''); var last = 0; var m;
    URL_RE.lastIndex = 0;
    while ((m = URL_RE.exec(s)) !== null) {
      if (m.index > last) el.appendChild(document.createTextNode(s.slice(last, m.index)));
      var a = document.createElement('a'); a.href = m[0]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = m[0];
      el.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < s.length) el.appendChild(document.createTextNode(s.slice(last)));
    URL_RE.lastIndex = 0;
  }
  function hasUrl(text) { URL_RE.lastIndex = 0; var r = URL_RE.test(String(text || '')); URL_RE.lastIndex = 0; return r; }
  function addMsg(kind, text, persist) {
    var el = document.createElement('div');
    el.className = 'msg ' + kind;
    if (kind === 'bot' && hasUrl(text)) fillText(el, text); else el.textContent = text;
    chat.appendChild(el);
    chat.scrollTop = chat.scrollHeight;
    if (persist !== false && kind !== 'sys') {
      history.push({ k: kind, t: text });
      saveHistory(history);
    }
    return el;
  }

  // Cards de produto: foto, nome, preço, "Comprar" (checkout da loja) e
  // "Quero esse" (vira mensagem do visitante — tudo dentro da conversa).
  function addCards(cards, persist) {
    if (!cards || !cards.length) return null;
    var wrap = document.createElement('div');
    wrap.className = 'cards';
    cards.forEach(function (c) {
      var card = document.createElement('div');
      card.className = 'card';
      if (c.image_url) {
        var img = document.createElement('img');
        img.className = 'img'; img.src = c.image_url; img.alt = c.title || ''; img.loading = 'lazy';
        card.appendChild(img);
      } else {
        var ph = document.createElement('div'); ph.className = 'noimg'; ph.textContent = c.kind === 'link' ? '🚀' : '🛍️';
        card.appendChild(ph);
      }
      var body = document.createElement('div'); body.className = 'body';
      var t = document.createElement('div'); t.className = 'title'; t.textContent = c.title || '';
      body.appendChild(t);
      if (c.subtitle) { var s = document.createElement('div'); s.className = 'sub'; s.textContent = c.subtitle; body.appendChild(s); }
      if (c.kind === 'checkout' && c.url) {
        // Caixinha da HUMA: Pix e cartão abrem AQUI, dentro do chat (2026-09-10).
        card.classList.add('checkout');
        var label = (c.buttons && c.buttons[0] && c.buttons[0].title) || 'Finalizar pedido';
        var pay = document.createElement('button'); pay.type = 'button'; pay.className = 'pay'; pay.textContent = label;
        pay.addEventListener('click', function () { openSheet(c.url, c.title || label); });
        body.appendChild(pay);
      } else if (c.kind === 'order') {
        // resumo do pedido: só leitura
      } else if (c.kind === 'link' && c.url) {
        // Próximo passo por link (2026-10-19): botão que abre o link do dono.
        var go = document.createElement('a'); go.className = 'buy'; go.href = c.url; go.target = '_blank'; go.rel = 'noopener';
        go.textContent = (c.buttons && c.buttons[0] && c.buttons[0].title) || c.title || 'Abrir';
        body.appendChild(go);
      } else {
        if (c.url) {
          var a = document.createElement('a'); a.className = 'buy'; a.href = c.url; a.target = '_blank'; a.rel = 'noopener';
          a.textContent = 'Comprar'; body.appendChild(a);
        }
        var w = document.createElement('button'); w.type = 'button'; w.className = 'want'; w.textContent = 'Quero esse';
        w.addEventListener('click', function () {
          if (sendBtn.disabled) return;
          input.value = 'Quero o ' + (c.title || 'produto');
          form.dispatchEvent(new Event('submit', { cancelable: true }));
        });
        body.appendChild(w);
      }
      card.appendChild(body);
      wrap.appendChild(card);
    });
    chat.appendChild(wrap);
    chat.scrollTop = chat.scrollHeight;
    if (persist !== false) {
      history.push({ k: 'cards', c: cards });
      saveHistory(history);
    }
    return wrap;
  }

  // Caixinha na bolha: painel com a página segura da HUMA por cima do chat.
  var sheetEl = null;
  function openSheet(url, title) {
    closeSheet();
    var sh = document.createElement('div'); sh.className = 'sheet';
    var bar = document.createElement('div'); bar.className = 'bar';
    var t = document.createElement('span'); t.textContent = 'Pagamento seguro · ' + (title || '');
    var x = document.createElement('button'); x.type = 'button'; x.textContent = 'Voltar ao chat';
    x.addEventListener('click', closeSheet);
    bar.appendChild(t); bar.appendChild(x);
    var fr = document.createElement('iframe'); fr.src = url; fr.title = 'Pagamento seguro';
    fr.setAttribute('allow', 'payment; clipboard-write');
    sh.appendChild(bar); sh.appendChild(fr);
    document.body.appendChild(sh);
    sheetEl = sh;
  }
  function closeSheet() {
    if (sheetEl && sheetEl.parentNode) sheetEl.parentNode.removeChild(sheetEl);
    sheetEl = null;
    pollOnce();
  }

  var typingEl = null;
  function showTyping() {
    if (typingEl) return;
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    chat.appendChild(typingEl);
    chat.scrollTop = chat.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    micBtn.disabled = busy;
    input.disabled = busy;
    if (!busy) input.focus();
  }

  // Restaura histórico local (a memória real vive no servidor).
  history.forEach(function (m) {
    if (m.k === 'cards') addCards(m.c, false); else addMsg(m.k, m.t, false);
  });

  // ── Info do negócio: 404 = indisponível de verdade; erro de rede =
  // tenta de novo (elevador, troca de antena) antes de desistir. ──
  var infoTries = 0;
  function loadInfo() {
    fetch('/api/web/' + encodeURIComponent(clientId) + '/info')
      .then(function (r) {
        if (r.status === 404) { var e = new Error('gone'); e.gone = true; throw e; }
        if (!r.ok) throw new Error('http');
        return r.json();
      })
      .then(function (info) {
        bizName.textContent = info.business_name;
        document.title = info.business_name + ' — Atendimento';
        avatar.textContent = (info.business_name || 'H').charAt(0).toUpperCase();
        if (history.length === 0 && info.greeting) {
          addMsg('bot', info.greeting);
        }
        startPolling();
      })
      .catch(function (err) {
        if (err.gone) {
          bizName.textContent = 'Atendimento indisponível';
          addMsg('sys', 'Este atendimento não está disponível no momento.');
          setBusy(true);
          return;
        }
        infoTries += 1;
        if (infoTries < 4) {
          setTimeout(loadInfo, 2500 * infoTries);
        } else {
          bizName.textContent = 'Sem conexão';
          addMsg('sys', 'Não consegui conectar. Verifique a internet e recarregue a página.');
        }
      });
  }
  loadInfo();

  // ── Poll: respostas assíncronas (dono respondendo pelo Cockpit). ──
  var pollTimer = null;
  function pollOnce() {
    if (seen === null || document.visibilityState !== 'visible') return;
    fetch('/api/web/' + encodeURIComponent(clientId) + '/messages?session_id=' + sessionId + '&after=' + seen)
      .then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function (data) {
        (data.messages || []).forEach(function (m) {
          if (m.cards && m.cards.length) addCards(m.cards);
          else if (m.content) addMsg('bot', m.content);
        });
        if (typeof data.total === 'number' && data.total > seen) setSeen(data.total);
      })
      .catch(function () { /* poll é oportunista; próximo tick tenta de novo */ });
  }
  function startPolling() {
    if (pollTimer) return;
    pollTimer = setInterval(pollOnce, 8000);
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = input.value.trim();
    if (!text || sendBtn.disabled) return;

    // Mostra na hora, mas só PERSISTE depois que o servidor confirmar —
    // senão um reload após falha mostraria a mensagem como entregue.
    addMsg('user', text, false);
    input.value = '';
    setBusy(true);
    showTyping();

    fetch('/api/web/' + encodeURIComponent(clientId) + '/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, text: text })
    })
      .then(function (r) {
        if (r.status === 429) throw new Error('rate');
        if (!r.ok) throw new Error('http');
        return r.json();
      })
      .then(function (data) { onReply(data, text); })
      .catch(onSendError);
  });

  // Resposta do servidor (texto ou áudio): persiste a mensagem do visitante
  // só agora, que o servidor confirmou, e desenha os balões da HUMA.
  function onReply(data, text) {
    hideTyping();
    history.push({ k: 'user', t: text });
    saveHistory(history);
    if (typeof data.history_len === 'number' && data.history_len > 0) {
      setSeen(data.history_len);
    }
    var replies = data.reply_parts || [];
    if (replies.length === 0) {
      addMsg('sys', 'Mensagem recebida. A equipe te responde por aqui.');
      setBusy(false);
      return;
    }
    var delay = 0;
    replies.forEach(function (part, idx) {
      delay += idx === 0 ? 0 : Math.min(400 + part.length * 8, 1400);
      setTimeout(function () { addMsg('bot', part); }, delay);
    });
    if (data.cards && data.cards.length) {
      delay += 500;
      setTimeout(function () { addCards(data.cards); }, delay);
    }
    // Libera o campo junto com a última parte agendada — sem depender
    // do callback rodar (aba escondida atrasa timer, storage pode falhar).
    setTimeout(function () { setBusy(false); }, delay);
  }
  function onSendError(err) {
    hideTyping();
    if (err && err.message === 'rate') {
      addMsg('sys', 'Muitas mensagens seguidas. Espere um instante e tente de novo.');
    } else if (err && err.message === 'big') {
      addMsg('sys', 'Áudio grande demais. Grave até uns 3 minutos.');
    } else {
      addMsg('sys', 'Não consegui enviar agora. Tente de novo em instantes.');
    }
    setBusy(false);
  }

  // ── Ditado por voz (2026-10-25, estilo Fin) ──
  // O visitante fala, o texto cai no campo e ele envia como mensagem de
  // texto. Toque no microfone: a barra vira × + onda da voz + ■. Ao parar,
  // o áudio vai pro servidor só pra transcrever (step=transcribe) e o texto
  // aparece no campo, editável. No computador o reconhecimento ao vivo
  // (Web Speech) já adianta as palavras enquanto o servidor confirma.
  // Sem suporte (http, navegador antigo) o botão nem aparece.
  var canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia &&
    window.MediaRecorder && window.isSecureContext);
  if (canRecord) micBtn.hidden = false;
  var recBars = document.getElementById('recBars');
  var recTime = document.getElementById('recTime');
  var recCancel = document.getElementById('recCancel');
  var recStop = document.getElementById('recStop');
  var recorder = null, recChunks = [], recStream = null, recTimer = null, recTick = null, recStartAt = 0;
  var recCancelled = false;
  var audioCtx = null, rafId = null;
  var REC_MAX_MS = 120000;
  var LIVE_BARS = 56;
  var PLACEHOLDER = input.placeholder;

  // Reconhecimento ao vivo só no computador: no celular ele disputa o
  // microfone com a gravação. O texto final é sempre o do servidor.
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || '');
  var liveText = '';
  var speech = null;
  function startLive() {
    liveText = '';
    if (!SR || isMobile) return;
    try {
      speech = new SR();
      speech.lang = 'pt-BR'; speech.continuous = true; speech.interimResults = true;
      speech.onresult = function (ev) {
        var s = '';
        for (var i = 0; i < ev.results.length; i++) s += ev.results[i][0].transcript + ' ';
        liveText = s.trim();
      };
      speech.onerror = function () { /* o servidor transcreve de qualquer jeito */ };
      speech.start();
    } catch (e) { speech = null; }
  }
  function stopLive() { if (speech) { try { speech.stop(); } catch (e) { /* já parou */ } speech = null; } }

  function fmtTime(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2);
  }
  function recMime() {
    var cands = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < cands.length; i++) {
      try { if (MediaRecorder.isTypeSupported(cands[i])) return cands[i]; } catch (e) { /* segue */ }
    }
    return '';
  }
  function extFor(mime) {
    mime = String(mime || '');
    if (mime.indexOf('mp4') >= 0) return 'm4a';
    if (mime.indexOf('ogg') >= 0) return 'ogg';
    if (mime.indexOf('wav') >= 0) return 'wav';
    return 'webm';
  }
  function stopStream() {
    if (recStream) { recStream.getTracks().forEach(function (t) { t.stop(); }); recStream = null; }
  }

  // Onda da voz: o AnalyserNode lê o volume e cada quadro empurra uma barra.
  function startMeter(stream) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var src = audioCtx.createMediaStreamSource(stream);
      var analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      var data = new Uint8Array(analyser.fftSize);
      recBars.innerHTML = '';
      var last = 0;
      function frame(ts) {
        rafId = requestAnimationFrame(frame);
        if (ts - last < 60) return;
        last = ts;
        analyser.getByteTimeDomainData(data);
        var sum = 0;
        for (var i = 0; i < data.length; i++) { var v = (data[i] - 128) / 128; sum += v * v; }
        var rms = Math.sqrt(sum / data.length);
        var bar = document.createElement('i');
        bar.style.height = Math.max(3, Math.min(30, Math.round(rms * 150))) + 'px';
        recBars.appendChild(bar);
        while (recBars.childNodes.length > LIVE_BARS) recBars.removeChild(recBars.firstChild);
      }
      rafId = requestAnimationFrame(frame);
    } catch (e) { /* sem visualizador, grava do mesmo jeito */ }
  }
  function stopMeter() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    if (audioCtx) { try { audioCtx.close(); } catch (e) { /* já fechado */ } audioCtx = null; }
  }
  function recOff() {
    clearTimeout(recTimer);
    clearInterval(recTick);
    form.classList.remove('recording');
    stopMeter();
    stopLive();
    stopStream();
  }
  function startRec() {
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
      recStream = stream;
      recChunks = [];
      recCancelled = false;
      var mime = recMime();
      try { recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
      catch (e) { recorder = new MediaRecorder(stream); }
      recorder.ondataavailable = function (ev) { if (ev.data && ev.data.size) recChunks.push(ev.data); };
      recorder.onstop = function () {
        var type = (recorder && recorder.mimeType) || mime || 'audio/webm';
        var ms = Date.now() - recStartAt;
        var preview = liveText;
        recorder = null;
        recOff();
        var blob = new Blob(recChunks, { type: type });
        recChunks = [];
        if (recCancelled) { input.focus(); return; }
        if (blob.size < 1500 || ms < 600) { addMsg('sys', 'Áudio muito curto. Fale um pouco mais.'); input.focus(); return; }
        transcribe(blob, type, preview);
      };
      recorder.start(250);
      recStartAt = Date.now();
      form.classList.add('recording');
      recTime.textContent = '0:00';
      recTick = setInterval(function () { recTime.textContent = fmtTime(Date.now() - recStartAt); }, 500);
      startMeter(stream);
      startLive();
      recTimer = setTimeout(function () {
        if (recorder && recorder.state === 'recording') recorder.stop();
      }, REC_MAX_MS);
    }).catch(function () {
      recOff();
      addMsg('sys', 'Não consegui usar o microfone. Libere a permissão no navegador ou escreva a mensagem.');
    });
  }
  micBtn.addEventListener('click', function () {
    if (micBtn.disabled || (recorder && recorder.state === 'recording')) return;
    startRec();
  });
  recStop.addEventListener('click', function () {
    if (recorder && recorder.state === 'recording') recorder.stop();
  });
  recCancel.addEventListener('click', function () {
    recCancelled = true;
    if (recorder && recorder.state === 'recording') recorder.stop(); else recOff();
  });

  // Manda o áudio só pra transcrever; o texto cai no campo, editável, e o
  // visitante envia como mensagem normal. O áudio em si não vira mensagem.
  function transcribe(blob, type, preview) {
    var before = (preview || '').trim();
    input.value = before;
    input.placeholder = 'Transcrevendo…';
    input.classList.add('transcribing');
    setBusy(true);

    var fd = new FormData();
    fd.append('session_id', sessionId);
    fd.append('step', 'transcribe');
    fd.append('file', blob, 'audio.' + extFor(type));
    fetch('/api/web/' + encodeURIComponent(clientId) + '/audio', { method: 'POST', body: fd })
      .then(function (r) {
        if (r.status === 429) throw new Error('rate');
        if (r.status === 413) throw new Error('big');
        if (!r.ok) throw new Error('http');
        return r.json();
      })
      .then(function (data) {
        var t = (data.transcript || '').trim();
        input.classList.remove('transcribing');
        input.placeholder = PLACEHOLDER;
        setBusy(false);
        if (data.status === 'no_speech' || !t) {
          if (!before) addMsg('sys', 'Não consegui entender o áudio. Pode falar de novo ou escrever?');
          return;
        }
        // Se o visitante já começou a editar a prévia, não atropela.
        if (input.value.trim() === before) input.value = t;
        input.focus();
        try { input.setSelectionRange(input.value.length, input.value.length); } catch (e) { /* ok */ }
      })
      .catch(function (err) {
        input.classList.remove('transcribing');
        input.placeholder = PLACEHOLDER;
        setBusy(false);
        if (err && err.message === 'rate') {
          addMsg('sys', 'Muitos áudios por hoje. Escreva a mensagem, por favor.');
        } else if (err && err.message === 'big') {
          addMsg('sys', 'Áudio grande demais. Fale até uns 2 minutos.');
        } else if (!before) {
          addMsg('sys', 'Não consegui transcrever agora. Tente de novo ou escreva.');
        }
        input.focus();
      });
  }

  input.focus();
})();
</script>
</body>
</html>
